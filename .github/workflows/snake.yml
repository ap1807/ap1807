# ══════════════════════════════════════════════════════════════════
# Contribution Snake — generates the animated snake eating your
# contribution graph, in light & dark monochrome variants.
#
# Install path:  ap1807/ap1807/.github/workflows/snake.yml
# Output:        pushed to the `output` branch → snake-light.svg
#                                          and snake-dark.svg
# ══════════════════════════════════════════════════════════════════

name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # refresh daily at 00:00 UTC
  workflow_dispatch:       # allow manual runs from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs (light + dark, frost palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%236e7781&color_dots=%23ebedf0,%23d0d7de,%239ea7b3,%236e7781,%2324292f
            dist/snake-dark.svg?color_snake=%23ffffff&color_dots=%23161b22,%23273038,%233d444d,%23545d68,%23f0f6fc

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
