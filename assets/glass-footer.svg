<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#eaeef2"/>
    </linearGradient>
    <radialGradient id="b1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9e1ea" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d9e1ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#33415c" flood-opacity="0.12"/>
    </filter>
    <filter id="blurBig" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="bar"><rect x="180" y="30" width="840" height="58" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="120" fill="url(#bg)"/>

  <g filter="url(#blurBig)">
    <circle cx="140" cy="95" r="70" fill="url(#b1)">
      <animate attributeName="cx" values="140;225;140" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="25" r="65" fill="url(#b1)">
      <animate attributeName="cx" values="1070;990;1070" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#soft)">
    <rect x="180" y="30" width="840" height="58" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.4"/>
  </g>

  <g clip-path="url(#bar)" opacity="0.5">
    <rect x="-300" y="10" width="200" height="100" fill="#ffffff" opacity="0.5" transform="skewX(-18)">
      <animate attributeName="x" values="-320;1220" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="600" y="64.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4b5563" letter-spacing="4">AI · LLM AGENTS · APPLIED ML · OPEN SOURCE</text>
</svg>
