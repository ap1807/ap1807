<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f6f8fa"/><stop offset="1" stop-color="#eaeef2"/>
    </linearGradient>
    <radialGradient id="b1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#d9e1ea" stop-opacity="0.9"/><stop offset="1" stop-color="#d9e1ea" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#33415c" flood-opacity="0.12"/></filter>
    <filter id="blurBig" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="bar"><rect x="180" y="26" width="840" height="58" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="160" fill="url(#bg)"/>

  <g filter="url(#blurBig)">
    <circle cx="140" cy="60" r="70" fill="url(#b1)">
      <animate attributeName="cx" values="140;240;140" dur="8.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="110" r="65" fill="url(#b1)">
      <animate attributeName="cx" values="1070;980;1070" dur="9.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#soft)">
    <rect x="180" y="26" width="840" height="58" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.4"/>
  </g>

  <g clip-path="url(#bar)" opacity="0.5">
    <rect x="-300" y="6" width="200" height="100" fill="#ffffff" opacity="0.5" transform="skewX(-18)">
      <animate attributeName="x" values="-320;1240" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="352" cy="55" r="4" fill="#22c55e" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="60.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4b5563" letter-spacing="4">AI · LLM AGENTS · APPLIED ML · OPEN SOURCE</text>

  <!-- seamless scrolling waves (period P, strip = 4P wide, translate by -P loops perfectly) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="16s" calcMode="linear" repeatCount="indefinite"/>
    <path d="M0,112 C200.0,99 200.0,99 400.0,112 C600.0,125 600.0,125 800,112 C1000.0,99 1000.0,99 1200.0,112 C1400.0,125 1400.0,125 1600,112 C1800.0,99 1800.0,99 2000.0,112 C2200.0,125 2200.0,125 2400,112 C2600.0,99 2600.0,99 2800.0,112 C3000.0,125 3000.0,125 3200,112 L3200,160 L0,160 Z" fill="#e2e9f1" opacity="0.9"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-600 0" dur="10.5s" calcMode="linear" repeatCount="indefinite"/>
    <path d="M0,128 C150.0,118 150.0,118 300.0,128 C450.0,138 450.0,138 600,128 C750.0,118 750.0,118 900.0,128 C1050.0,138 1050.0,138 1200,128 C1350.0,118 1350.0,118 1500.0,128 C1650.0,138 1650.0,138 1800,128 C1950.0,118 1950.0,118 2100.0,128 C2250.0,138 2250.0,138 2400,128 L2400,160 L0,160 Z" fill="#d7dfe9" opacity="0.95"/>
  </g>
</svg>
