<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f5f7fa"/>
      <stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
    <radialGradient id="b1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9e1ea" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d9e1ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfd8e3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#cfd8e3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="glassChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#33415c" flood-opacity="0.13"/>
    </filter>
    <filter id="softSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#33415c" flood-opacity="0.12"/>
    </filter>
    <filter id="blurBig" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="38"/></filter>
    <clipPath id="panel"><rect x="180" y="66" width="840" height="168" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- depth blobs, blurred and drifting -->
  <g filter="url(#blurBig)">
    <circle cx="170" cy="70" r="95" fill="url(#b1)">
      <animate attributeName="cx" values="170;265;170" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="235" r="115" fill="url(#b2)">
      <animate attributeName="cx" values="1020;930;1020" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="615" cy="270" r="85" fill="url(#b2)" opacity="0.8">
      <animate attributeName="cy" values="270;225;270" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="45" r="60" fill="url(#b1)">
      <animate attributeName="cy" values="45;85;45" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating glass orbs -->
  <g filter="url(#softSm)">
    <circle cx="120" cy="210" r="17" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.4">
      <animate attributeName="cy" values="210;192;210" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1108" cy="96" r="12" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.4">
      <animate attributeName="cy" values="96;112;96" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="92" r="8" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.2">
      <animate attributeName="cy" values="92;80;92" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- main frosted panel -->
  <g filter="url(#soft)">
    <rect x="180" y="66" width="840" height="168" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.6"/>
  </g>

  <!-- shine sweep clipped to panel -->
  <g clip-path="url(#panel)" opacity="0.55">
    <rect x="-320" y="40" width="230" height="220" fill="#ffffff" opacity="0.5" transform="skewX(-18)">
      <animate attributeName="x" values="-340;1240" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- name + role -->
  <text x="600" y="131" text-anchor="middle" font-size="42" font-weight="700" fill="#1f2328" letter-spacing="0.5">Adityaraj Patil</text>
  <text x="600" y="164" text-anchor="middle" font-size="15.5" fill="#57606a" letter-spacing="0.4">AI/ML Engineer · Building LLM-powered agents &amp; applications</text>

  <!-- role chips -->
  <g filter="url(#softSm)">
    <rect x="366" y="188" width="140" height="27" rx="13.5" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.2"/>
    <rect x="520" y="188" width="150" height="27" rx="13.5" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.2"/>
    <rect x="684" y="188" width="164" height="27" rx="13.5" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.2"/>
  </g>
  <text x="436" y="205.5" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" letter-spacing="1">AI / ML ENGINEER</text>
  <text x="595" y="205.5" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" letter-spacing="1">LLM AGENTS · RAG</text>
  <text x="766" y="205.5" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" letter-spacing="1">PYTHON · TYPESCRIPT</text>
</svg>
