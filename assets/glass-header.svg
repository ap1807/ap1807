<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f5f7fa"/><stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
    <radialGradient id="b1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#d9e1ea" stop-opacity="0.95"/><stop offset="1" stop-color="#d9e1ea" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#cfd8e3" stop-opacity="0.9"/><stop offset="1" stop-color="#cfd8e3" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.38"/></linearGradient>
    <linearGradient id="glassChip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/></linearGradient>
    <linearGradient id="nameShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#33415c" flood-opacity="0.13"/></filter>
    <filter id="softSm" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#33415c" flood-opacity="0.12"/></filter>
    <filter id="blurBig" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="38"/></filter>
    <clipPath id="panel"><rect x="180" y="66" width="840" height="168" rx="24"/></clipPath>
    <clipPath id="nameZone"><rect x="400" y="98" width="400" height="44"/></clipPath>
    <clipPath id="tw0"><rect x="306" y="156" height="24" width="0"><animate attributeName="width" values="0;225.3;225.3;0;0" keyTimes="0.0;0.2;0.225;0.2917;1.0" dur="12.0s" begin="0.0s" calcMode="linear" repeatCount="indefinite"/></rect></clipPath><clipPath id="tw1"><rect x="306" y="156" height="24" width="0"><animate attributeName="width" values="0;354.1;354.1;0;0" keyTimes="0.0;0.2;0.225;0.2917;1.0" dur="12.0s" begin="3.0s" calcMode="linear" repeatCount="indefinite"/></rect></clipPath><clipPath id="tw2"><rect x="306" y="156" height="24" width="0"><animate attributeName="width" values="0;313.9;313.9;0;0" keyTimes="0.0;0.2;0.225;0.2917;1.0" dur="12.0s" begin="6.0s" calcMode="linear" repeatCount="indefinite"/></rect></clipPath><clipPath id="tw3"><rect x="306" y="156" height="24" width="0"><animate attributeName="width" values="0;241.4;241.4;0;0" keyTimes="0.0;0.2;0.225;0.2917;1.0" dur="12.0s" begin="9.0s" calcMode="linear" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- drifting mist blobs -->
  <g filter="url(#blurBig)">
    <circle cx="170" cy="70" r="95" fill="url(#b1)">
      <animate attributeName="cx" values="170;280;170" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="235" r="115" fill="url(#b2)">
      <animate attributeName="cx" values="1020;900;1020" dur="10.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="615" cy="270" r="85" fill="url(#b2)" opacity="0.8">
      <animate attributeName="cy" values="270;215;270" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="45" r="60" fill="url(#b1)">
      <animate attributeName="cy" values="45;95;45" dur="8.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating glass orbs -->
  <g filter="url(#softSm)">
    <circle cx="120" cy="210" r="17" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.4">
      <animate attributeName="cy" values="210;184;210" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1108" cy="96" r="12" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.4">
      <animate attributeName="cy" values="96;120;96" dur="5.6s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1108;1092;1108" dur="7.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="92" r="8" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.2">
      <animate attributeName="cy" values="92;76;92" dur="4.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="52" r="5.5" fill="#ffffff" stroke="#d7dfeb" stroke-width="1" opacity="0.9">
      <animate attributeName="cy" values="52;40;52" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1052" cy="252" r="6.5" fill="#ffffff" stroke="#d7dfeb" stroke-width="1" opacity="0.9">
      <animate attributeName="cy" values="252;238;252" dur="4.1s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- main frosted panel -->
  <g filter="url(#soft)">
    <rect x="180" y="66" width="840" height="168" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.6"/>
  </g>

  <!-- panel-wide shine sweep -->
  <g clip-path="url(#panel)" opacity="0.55">
    <rect x="-340" y="40" width="230" height="220" fill="#ffffff" opacity="0.5" transform="skewX(-18)">
      <animate attributeName="x" values="-340;1260" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- name + shimmer highlight sweeping across it -->
  <text x="600" y="131" text-anchor="middle" font-size="42" font-weight="700" fill="#1f2328" letter-spacing="0.5">Adityaraj Patil</text>
  <g clip-path="url(#nameZone)" opacity="0.5">
    <rect x="-120" y="98" width="130" height="44" fill="url(#nameShine)" transform="skewX(-14)">
      <animate attributeName="x" values="-140;560" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- prompt + typewriter roles -->
  <text x="284" y="171" font-size="15.5" font-weight="700" fill="#9aa8b8">&gt;</text>
  
  <!-- typewriter role 0 -->
  <g clip-path="url(#tw0)">
    <text x="306" y="171" font-size="15.5" font-weight="500" fill="#39414d" letter-spacing="0.4" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.02;0.225;0.2458;1.0" dur="12.0s" begin="0.0s" calcMode="linear" repeatCount="indefinite"/>AI/ML Engineer · CSE @ LPU</text>
  </g>
  <rect x="306" y="158" width="2" height="17" rx="1" fill="#8ea0b5" opacity="0">
    <animate attributeName="x" values="306.0;531.3;531.3;306.0;306.0" keyTimes="0.0;0.2;0.225;0.2917;1.0" dur="12.0s" begin="0.0s" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.02;0.225;0.2458;1.0" dur="12.0s" begin="0.0s" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <!-- typewriter role 1 -->
  <g clip-path="url(#tw1)">
    <text x="306" y="171" font-size="15.5" font-weight="500" fill="#39414d" letter-spacing="0.4" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.02;0.225;0.2458;1.0" dur="12.0s" begin="3.0s" calcMode="linear" repeatCount="indefinite"/>Building LLM-powered agents &amp; applications</text>
  </g>
  <rect x="306" y="158" width="2" height="17" rx="1" fill="#8ea0b5" opacity="0">
    <animate attributeName="x" values="306.0;660.1;660.1;306.0;306.0" keyTimes="0.0;0.2;0.225;0.2917;1.0" dur="12.0s" begin="3.0s" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.02;0.225;0.2458;1.0" dur="12.0s" begin="3.0s" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <!-- typewriter role 2 -->
  <g clip-path="url(#tw2)">
    <text x="306" y="171" font-size="15.5" font-weight="500" fill="#39414d" letter-spacing="0.4" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.02;0.225;0.2458;1.0" dur="12.0s" begin="6.0s" calcMode="linear" repeatCount="indefinite"/>LangChain · RAG · Tool-calling agents</text>
  </g>
  <rect x="306" y="158" width="2" height="17" rx="1" fill="#8ea0b5" opacity="0">
    <animate attributeName="x" values="306.0;619.9;619.9;306.0;306.0" keyTimes="0.0;0.2;0.225;0.2917;1.0" dur="12.0s" begin="6.0s" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.02;0.225;0.2458;1.0" dur="12.0s" begin="6.0s" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <!-- typewriter role 3 -->
  <g clip-path="url(#tw3)">
    <text x="306" y="171" font-size="15.5" font-weight="500" fill="#39414d" letter-spacing="0.4" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.02;0.225;0.2458;1.0" dur="12.0s" begin="9.0s" calcMode="linear" repeatCount="indefinite"/>From experiment → production</text>
  </g>
  <rect x="306" y="158" width="2" height="17" rx="1" fill="#8ea0b5" opacity="0">
    <animate attributeName="x" values="306.0;547.4;547.4;306.0;306.0" keyTimes="0.0;0.2;0.225;0.2917;1.0" dur="12.0s" begin="9.0s" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.02;0.225;0.2458;1.0" dur="12.0s" begin="9.0s" calcMode="linear" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;1;0.35" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- role chips (gentle staggered bob) -->
  <g filter="url(#softSm)">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -3.5;0 0" dur="4.2s" begin="0.0s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1" repeatCount="indefinite"/>
      <rect x="366" y="188" width="140" height="27" rx="13.5" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.2"/>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -3.5;0 0" dur="4.6s" begin="0.3s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1" repeatCount="indefinite"/>
      <rect x="520" y="188" width="150" height="27" rx="13.5" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.2"/>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -3.5;0 0" dur="5.0s" begin="0.6s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1" repeatCount="indefinite"/>
      <rect x="684" y="188" width="164" height="27" rx="13.5" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.2"/>
    </g>
  </g>
  <text x="436" y="205.5" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" letter-spacing="1">AI / ML ENGINEER</text>
  <text x="595" y="205.5" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" letter-spacing="1">LLM AGENTS · RAG</text>
  <text x="766" y="205.5" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" letter-spacing="1">PYTHON · TYPESCRIPT</text>

  <!-- open-to-work beacon -->
  <g>
    <rect x="852" y="80" width="152" height="27" rx="13.5" fill="url(#glassChip)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.2" filter="url(#softSm)"/>
    <circle cx="872" cy="93.5" r="5" fill="#22c55e"/>
    <circle cx="872" cy="93.5" r="5" fill="none" stroke="#22c55e" stroke-width="1.6" opacity="0">
      <animate attributeName="r" values="5;14" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;0" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="872" cy="93.5" r="5" fill="none" stroke="#22c55e" stroke-width="1.6" opacity="0">
      <animate attributeName="r" values="5;14" dur="1.9s" begin="0.95s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;0" dur="1.9s" begin="0.95s" repeatCount="indefinite"/>
    </circle>
    <text x="888" y="97.5" font-size="10.5" font-weight="700" fill="#166534" letter-spacing="1.2">OPEN TO WORK</text>
  </g>
</svg>
