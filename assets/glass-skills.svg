<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#eaeef2"/>
    </linearGradient>
    <radialGradient id="b1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9e1ea" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d9e1ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="softSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#33415c" flood-opacity="0.11"/>
    </filter>
    <filter id="blurBig" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="1200" height="250" fill="url(#bg)"/>

  <g filter="url(#blurBig)">
    <circle cx="150" cy="40" r="80" fill="url(#b1)">
      <animate attributeName="cx" values="150;230;150" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="210" r="90" fill="url(#b1)">
      <animate attributeName="cx" values="1060;980;1060" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#57606a" letter-spacing="5">TECH STACK</text>

  <!-- row 1 -->
  <g filter="url(#softSm)">
    <g>
      <rect x="27" y="58" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="193" y="58" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.6s" begin="0.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="359" y="58" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.2s" begin="0.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="525" y="58" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.8s" begin="1.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="691" y="58" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.4s" begin="1.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="857" y="58" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="6s" begin="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="1023" y="58" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.5s" begin="2.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <circle cx="53" cy="87" r="6" fill="#8c959f"/>
  <circle cx="219" cy="87" r="6" fill="#8c959f"/>
  <circle cx="385" cy="87" r="6" fill="#8c959f"/>
  <circle cx="551" cy="87" r="6" fill="#8c959f"/>
  <circle cx="717" cy="87" r="6" fill="#8c959f"/>
  <circle cx="883" cy="87" r="6" fill="#8c959f"/>
  <circle cx="1049" cy="87" r="6" fill="#8c959f"/>
  <text x="71" y="92" font-size="13.5" font-weight="600" fill="#24292f">Python</text>
  <text x="237" y="92" font-size="13.5" font-weight="600" fill="#24292f">TypeScript</text>
  <text x="403" y="92" font-size="13.5" font-weight="600" fill="#24292f">JavaScript</text>
  <text x="569" y="92" font-size="13.5" font-weight="600" fill="#24292f">C++</text>
  <text x="735" y="92" font-size="13.5" font-weight="600" fill="#24292f">LangChain</text>
  <text x="901" y="92" font-size="13.5" font-weight="600" fill="#24292f">OpenAI</text>
  <text x="1067" y="92" font-size="13.5" font-weight="600" fill="#24292f">Gemini</text>

  <!-- row 2 -->
  <g filter="url(#softSm)">
    <g>
      <rect x="27" y="150" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.7s" begin="0.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="193" y="150" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.3s" begin="0.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="359" y="150" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.9s" begin="1s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="525" y="150" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.1s" begin="1.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="691" y="150" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.6s" begin="1.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="857" y="150" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="6.1s" begin="2.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="1023" y="150" width="150" height="58" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.4s" begin="2.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <circle cx="53" cy="179" r="6" fill="#8c959f"/>
  <circle cx="219" cy="179" r="6" fill="#8c959f"/>
  <circle cx="385" cy="179" r="6" fill="#8c959f"/>
  <circle cx="551" cy="179" r="6" fill="#8c959f"/>
  <circle cx="717" cy="179" r="6" fill="#8c959f"/>
  <circle cx="883" cy="179" r="6" fill="#8c959f"/>
  <circle cx="1049" cy="179" r="6" fill="#8c959f"/>
  <text x="71" y="184" font-size="13.5" font-weight="600" fill="#24292f">Streamlit</text>
  <text x="237" y="184" font-size="13.5" font-weight="600" fill="#24292f">Next.js</text>
  <text x="403" y="184" font-size="13.5" font-weight="600" fill="#24292f">React</text>
  <text x="569" y="184" font-size="13.5" font-weight="600" fill="#24292f">Django</text>
  <text x="735" y="184" font-size="13.5" font-weight="600" fill="#24292f">Tailwind</text>
  <text x="901" y="184" font-size="13.5" font-weight="600" fill="#24292f">Git</text>
  <text x="1067" y="184" font-size="13.5" font-weight="600" fill="#24292f">Vercel</text>
</svg>
